# Разработка: http://localhost:8080 (клиент + /api), письма — http://localhost:8025 (Mailpit).
# Запуск: ./run.sh dev
name: mebel-dev
services:
  caddy:
    image: caddy:2-alpine
    ports: ["8080:80"]
    environment:
      SITE_ADDRESS: ":80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
    depends_on: [api]

  api:
    build: { context: .., dockerfile: server/Dockerfile }
    environment:
      DATABASE_URL: postgres://mebel:mebel@postgres:5432/mebel
      APP_URL: http://localhost:8080
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mebel, POSTGRES_PASSWORD: mebel, POSTGRES_DB: mebel }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebel -d mebel"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]

volumes: { pgdata: {} }
