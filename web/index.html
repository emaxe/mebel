  .handle{display:none}
  .tabs{display:flex;position:sticky;top:0;z-index:5;margin:0 -16px 12px;padding:10px 16px 8px;background:#faf9f6;gap:6px;border-bottom:1px solid #e8e4dc}
  .tabs button{flex:1;border:1px solid #d9d4ca;background:#fff;border-radius:6px;font:inherit;font-size:13px;padding:7px 0;cursor:pointer;color:#22211e}
  .tabs button.on{background:#22211e;border-color:#22211e;color:#faf9f6}
  aside [data-tab]{display:none}
  aside[data-tab=sections] [data-tab=sections],aside[data-tab=params] [data-tab=params]{display:block}
  h2:first-child{margin-top:4px}
  three-d-stage{height:100%}
  three-d-stage:not(:defined){visibility:hidden}
  /* телефон: панель выезжает снизу (peek / half / full), три вкладки, крупные элементы управления */
  @media (max-width:760px){
    .app{display:block;height:100dvh}
    .top{position:fixed;left:0;right:0;top:0;height:48px;gap:4px;padding:0 8px}
    .top .badge,.top .dims,.top .saved,.top .syncst,.top [data-x=prod],.top [data-x=cat]{display:none}
    .mob-only{display:block!important}
    .pname{max-width:none;font-size:14px}
    .top .mwrap:first-of-type{flex:1}
    .stagebox{position:fixed;left:0;right:0;top:48px;bottom:0;z-index:0}
    three-d-stage{position:absolute;inset:0;height:100%}
    .partcard{top:8px;left:8px;right:8px;width:auto;max-height:28%}
    .viewbar{left:8px;right:8px;bottom:84px;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:6px 10px}
    .viewbar input[type=range]{width:90px}
    aside{position:fixed;left:0;right:0;bottom:0;z-index:20;height:72px;max-height:92dvh;border-right:0;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);padding:0 14px 28px;transition:height .22s ease;overscroll-behavior:contain}
    aside[data-snap=half]{height:50dvh}aside[data-snap=full]{height:88dvh}
    .handle{display:flex;justify-content:center;align-items:center;position:sticky;top:0;z-index:5;height:30px;margin:0 -14px;background:#faf9f6;border-radius:16px 16px 0 0;cursor:grab;touch-action:none}
    .handle i{width:42px;height:5px;border-radius:3px;background:#cfc9bc}
    .tabs{top:30px;margin:0 -14px 10px;padding:0 14px 6px;border-bottom:0}
    .tabs button{min-height:44px;border-radius:8px;font-size:14px}
    dialog.projects{width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
    .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .phead .dtext{width:100%;order:5}
    .tbtn{min-height:40px}
    aside button,aside select,.dfoot button,.menu button{min-height:44px}
    aside input:not([type=range]):not([type=checkbox]),aside select{min-height:44px;font-size:16px}
    aside input[type=range]{min-height:32px}
    .seg button,.acts button,.strip button,.mini{min-height:44px}
    .tog input{width:24px;height:24px}
    .item{grid-template-columns:minmax(0,1fr) 72px 72px 44px}
    .item .x{min-height:44px}
    .sw button{width:40px;height:40px}
    .tip{width:24px;height:24px;font-size:13px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="tbtn" id="bproj" title="Все проекты">☰ Проекты</button>
    <div class="mwrap"><button class="pname" id="pname" title="Переименовать проект"></button><button class="tbtn" id="pmenu" title="Действия с проектом" aria-label="Меню проекта">⋯</button>
      <div class="menu" id="pm" hidden><button data-pm="rename">Переименовать…</button><button data-pm="saveas">Дублировать…</button><button data-pm="reset">Сбросить к шаблону</button><div class="sep"></div><button data-pm="share">Ссылка для просмотра…</button><button data-pm="versions">История версий…</button><div class="sep"></div><button data-pm="export">Экспорт в файл .json</button><div class="sep"></div><button data-pm="del">Удалить…</button></div></div>
    <span class="badge" id="tbadge"></span><span class="dims" id="dims"></span>
    <div class="sp"></div>
    <button class="tbtn" id="undo" disabled title="Отменить последнее изменение (Ctrl/⌘+Z)">↶</button><button class="tbtn" id="redo" disabled title="Вернуть отменённое (Ctrl/⌘+Shift+Z)">↷</button>
    <span class="saved" id="saved" role="status"></span>
    <span class="syncst" id="syncst" role="status" hidden></span>
    <div class="mwrap xwrap"><button class="tbtn" id="bacct" hidden>Войти</button><div class="menu" id="am" hidden></div></div>
    <button class="tbtn pri" data-x="prod" title="Общий вид, смета, спецификация, раскрой и присадка — для печати или PDF">Задание на распил</button>
    <div class="mwrap xwrap"><button class="tbtn" id="xmenu">Экспорт ▾</button>
      <div class="menu" id="xm" hidden>
        <button class="mob-only" data-x="prod">Задание на распил</button>
        <button data-x="kp">КП для клиента</button>
        <button data-x="labels">Этикетки с QR</button>
        <button data-x="asm">Инструкция по сборке</button>
        <button data-x="buy">Список покупок</button>
        <div class="sep"></div>
        <button data-x="csv">CSV / Excel</button>
        <button data-x="dxf">DXF для ЧПУ</button>
        <button data-x="cutcsv" title="Таблица деталей для сервисов раскроя: пильные и чистовые размеры, кромка, поворот, волокна">Раскрой: CSV для сервисов</button>
        <button data-x="cutmap" title="Карта раскроя по листам в DXF: листы, обрезка, детали с номерами, остатки">Карта раскроя DXF</button>
        <button data-x="drill" title="Контуры, отверстия, пазы и фрезеровки в JSON для постпроцессора станка">Операции ЧПУ (JSON)</button>
        <button data-x="obj">3D-модель OBJ + MTL</button>
        <button data-x="glb">3D-модель GLB</button>
        <div class="sep mob-only"></div>
        <button class="mob-only" data-x="cat">Справочник и цены</button>
      </div></div>
    <button class="tbtn" data-x="cat" title="Листы, кромка, фурнитура, цены, параметры раскроя">⚙ Справочник</button>
  </header>
  <aside id="panel">
    <div class="handle" id="handle" role="button" aria-label="Потянуть вверх или вниз, чтобы раскрыть панель"><i></i></div>
    <nav class="tabs" id="tabs" role="tablist"><button data-go="sections" role="tab">Секции</button><button data-go="params" role="tab">Параметры</button></nav>
    <div class="mods" id="mods"></div>
    <div class="warn" id="warn" style="display:none"></div>
    <div data-tab="sections">
      <h2>Секции</h2>
      <div class="hint" style="margin:-4px 0 8px">Выберите секцию здесь или кликом по модели</div>
      <div id="secs"></div>
    </div>
    <div data-tab="params">
      <h2>Параметры изделия</h2>
      <div id="controls"></div>
    </div>
  </aside>
  <div class="stagebox">
    <three-d-stage name="mebel" no-ui></three-d-stage>
    <div class="viewbar" id="view" aria-label="Вид"></div>
    <svg class="dimsvg" id="dimsvg" aria-hidden="true"></svg>
    <div class="dimlabels" id="dimlabels"></div>
    <div class="partcard" id="partcard" hidden aria-live="polite"></div>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<dialog id="projDlg" class="projects"></dialog>
<script src="three-d-stage.js"></script>
<script type="module" src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
