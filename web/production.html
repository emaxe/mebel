<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задание на распил и присадку</title>
<style>
  body{margin:0;background:#ecebe6;font:13px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#1f1e1b}
  a{color:#1f1e1b} a:hover{color:#6b5a45}
  .doc{max-width:1060px;margin:0 auto;padding:32px 28px 80px}
  .sheet{background:#fff;border:1px solid #dcd8cf;border-radius:6px;padding:26px 28px;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 4px;font-weight:600}
  h2{font-size:15px;margin:0 0 14px;font-weight:600}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;margin-top:16px}
  .meta div span{display:block;font-size:11px;color:#8a8478;text-transform:uppercase;letter-spacing:.06em}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .bar button,.bar a{border:1px solid #cfcac0;background:#fff;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none}
  .bar button.pri{background:#1f1e1b;color:#fff;border-color:#1f1e1b}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{font-weight:600;text-align:left;border-bottom:1.5px solid #1f1e1b;padding:6px 6px;white-space:nowrap}
  td{border-bottom:1px solid #e6e2da;padding:5px 6px;vertical-align:top}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
  .warn{background:#fff4e5;border:1px solid #f0c48a;border-radius:6px;padding:10px 14px;margin-bottom:18px}
  .part{border-top:1px solid #e6e2da;padding:18px 0 8px;break-inside:avoid}
  .part:first-of-type{border-top:0;padding-top:0}
  .part table{margin-bottom:10px}
  .ph{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-bottom:8px}
  .ph b{font-size:14px}
  .ph span{color:#6f6a60}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:#4a463f}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .muted{color:#8a8478}
  svg text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .bar button.on{background:#6b5a45;color:#fff;border-color:#6b5a45}
  .m-task,.m-kp,.m-labels,.m-asm,.m-buy{display:none}
  body[data-mode=task] .m-task,body[data-mode=kp] .m-kp,body[data-mode=labels] .m-labels,body[data-mode=asm] .m-asm,body[data-mode=buy] .m-buy{display:block}
  .chk{background:#f3f8f1;border:1px solid #b9d3b0;border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:12.5px}
  .chk.bad{background:#fdf0ee;border-color:#e2a59d}.chk ul{margin:6px 0 0;padding-left:18px}.chk .e{color:#b03a2e}.chk .w{color:#9a6a12}
  .step{break-inside:avoid}
  .step .cols{display:grid;grid-template-columns:minmax(300px,1.2fr) minmax(260px,1fr);gap:20px;align-items:start}
  .step h2 .no{display:inline-block;background:#1f1e1b;color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;font-size:13px;margin-right:8px}
  .step p{margin:0 0 8px}.step table{margin-bottom:10px}.step .tools{color:#6f6a60;font-size:12px}
  .buy td.c,.buy th.c{width:28px;text-align:center}.buy tr.done td{color:#9a958a;text-decoration:line-through}.buy a{word-break:break-all}
  @media(max-width:760px){.step .cols{grid-template-columns:1fr}}
  .views{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
  .views svg{border:1px solid #e6e2da;border-radius:4px}
  .tot td{font-weight:600;border-top:1.5px solid #1f1e1b}
  .est h3{font-size:12px;margin:14px 0 4px;color:#4a463f}
  .nop{color:#c0392b}
  .kp{max-width:760px;margin:0 auto}
  .kp img{width:100%;border-radius:6px;border:1px solid #e6e2da;background:#faf9f6}
  .kp .price{font-size:30px;font-weight:600;margin:14px 0 4px}
  .kp .terms{border:1px dashed #cfcac0;border-radius:6px;padding:10px 12px;min-height:60px;white-space:pre-wrap}
  .labels{display:grid;grid-template-columns:repeat(3,70mm);grid-auto-rows:37.125mm;width:210mm;margin:0 auto;background:#fff;box-shadow:0 0 0 1px #dcd8cf}
  .lab{box-sizing:border-box;padding:2.2mm 2.6mm;display:grid;grid-template-columns:1fr 23mm;grid-template-rows:auto 1fr auto;gap:0 2mm;border:.2mm dashed #cfcac0;overflow:hidden;font-size:8.2pt;line-height:1.25}
  .lab b{font-size:9.4pt}
  .lab .qr{grid-row:1/3;grid-column:2;align-self:start}
  .lab .qr svg{width:22mm;height:22mm;display:block}
  .lab .edge{grid-column:2;grid-row:3;justify-self:end}
  .lab .sz{font-family:ui-monospace,Menlo,monospace;font-size:8pt}
  .lab .mt{color:#555;font-size:7pt}
  @page{margin:0}
  @media print{body{background:#fff}.doc{padding:12mm;max-width:none}.sheet{border:0;padding:0 0 10mm;break-after:page}.bar{display:none}
    body[data-mode=labels] .doc{padding:0}body[data-mode=labels] .sheet{padding:0;break-after:auto}body[data-mode=labels] h2,body[data-mode=labels] .sheet>p{display:none}.labels{box-shadow:none;margin:0}.lab{border:.2mm dashed #ddd}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b5a45">
</head>
<body>
<div class="doc" id="doc"></div>
<script src="vendor/qrcode/qrcode.js"></script>
<script src="vendor/qrcode/qrcode_UTF8.js"></script>
<script type="module">
import { toCSV, toDXF } from './export.js';
import { loadCatalog } from './catalog.js';
import { renderProduction, shopId, shopUnit } from './production-view.js';
import { KIND_LABELS } from './fittings.js';
const doc = document.getElementById('doc');
// ?share=токен — проект по ссылке для просмотра (с сервера, без входа); иначе текущий проект из localStorage
const shareToken = new URLSearchParams(location.search).get('share');
let P, cat, projName, preview = null;
if (shareToken) {
  const r = await fetch('api/share/' + encodeURIComponent(shareToken)).then(x => (x.ok ? x.json() : null)).catch(() => null);
  if (!r) { doc.innerHTML = '<div class="sheet">Ссылка недействительна или отозвана.</div>'; throw 0; }
  P = r.P; projName = r.name; cat = loadCatalog({ getItem: () => (r.catalog ? JSON.stringify(r.catalog) : null) });
} else {
  P = JSON.parse(localStorage.getItem('mebel-v3') || 'null');
  if (!P) { doc.innerHTML = '<div class="sheet">Нет данных. Откройте <a href="index.html">конструктор</a> и настройте изделие.</div>'; throw 0; }
  cat = loadCatalog(); projName = localStorage.getItem('mebel-v3-name') || 'Проект'; preview = localStorage.getItem('mebel-preview');
}
const boughtKey = 'mebel-bought:' + (shareToken || localStorage.getItem('mebel-current') || projName);
let bought = new Set(); try { bought = new Set(JSON.parse(localStorage.getItem(boughtKey) || '[]')); } catch { /* без отметок */ }
const { html, spec, title, stamp, shop, rub } = renderProduction({ P, cat, projName, preview, shareToken, bought, baseHref: location.href });
const download = (data, name, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; a.click(); };
doc.innerHTML = html;
// список покупок: отметки «куплено» (хранятся в браузере), CSV, копирование
{
  const rows = [...document.querySelectorAll('.buy tr[data-i]')], upd = () => {
    localStorage.setItem(boughtKey, JSON.stringify(shop.filter((l, i) => rows[i].classList.contains('done')).map(shopId)));
    document.getElementById('leftv').textContent = rub(shop.reduce((a, l, i) => a + (rows[i].classList.contains('done') ? 0 : l.sum), 0));
  };
  rows.forEach(r => (r.querySelector('input').onchange = e => { r.classList.toggle('done', e.target.checked); try { upd(); } catch { /* без хранилища */ } }));
  try { upd(); } catch { /* без хранилища */ }
  document.getElementById('breset').onclick = () => { rows.forEach(r => { r.classList.remove('done'); r.querySelector('input').checked = false; }); try { upd(); } catch { /* без хранилища */ } };
  document.getElementById('bcsv').onclick = () => download('\ufeff' + [['Категория', 'Название', 'Артикул', 'Нужно', 'Запас', 'Купить', 'Упаковка', 'Цена', 'Сумма', 'Ссылка'], ...shop.map(l => [KIND_LABELS[l.kind] || l.kind, (l.brand ? l.brand + ' ' : '') + l.title, l.art, l.need, l.reserve, l.buy, l.pack, l.price ?? '', l.sum, l.url])].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n'), stamp + '_pokupki.csv', 'text/csv;charset=utf-8');
  document.getElementById('bcopy').onclick = async () => {
    const text = `${title}\n` + shop.map((l, i) => `${rows[i].classList.contains('done') ? '[x]' : '[ ]'} ${(l.brand ? l.brand + ' ' : '') + l.title}${l.art ? ` (${l.art})` : ''}: ${shopUnit(l)}`).join('\n');
    try { await navigator.clipboard.writeText(text); document.getElementById('bcopy').textContent = 'Скопировано'; } catch { prompt('Скопируйте список:', text); }
  };
}

const setMode = m => { document.body.dataset.mode = m; document.querySelectorAll('.bar [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === m)); history.replaceState(null, '', m === 'task' ? location.pathname + location.search : '#' + m); document.title = { task: 'Задание на распил и присадку', kp: 'Коммерческое предложение', labels: 'Этикетки деталей', asm: 'Инструкция по сборке', buy: 'Список покупок' }[m]; };
document.querySelectorAll('.bar [data-m]').forEach(b => (b.onclick = () => setMode(b.dataset.m)));
setMode(['kp', 'labels', 'asm', 'buy'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'task');
document.getElementById('pr').onclick = () => print();
document.getElementById('csv').onclick = () => download(toCSV(spec, title), stamp + '.csv', 'text/csv;charset=utf-8');
document.getElementById('dxf').onclick = () => download(toDXF(spec), stamp + '.dxf', 'application/dxf');
</script>
<script src="pwa.js"></script>
</body>
</html>
